name: VECTOR Native APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/vector-native-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build VECTOR
        working-directory: android
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ ! -f gradlew ]; then
            curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
            unzip -q gradle.zip
            ./gradle-8.9/bin/gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Prepare APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/VECTOR.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vector-${{ github.run_number }}
          name: VECTOR Native APK ${{ github.run_number }}
          files: release/VECTOR.apk
          generate_release_notes: true
